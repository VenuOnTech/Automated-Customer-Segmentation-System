name: ML Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ==============================
      # 🔹 CHECKOUT
      # ==============================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==============================
      # 🔹 PYTHON SETUP
      # ==============================
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      # ==============================
      # 🔹 CACHE
      # ==============================
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # ==============================
      # 🔹 INSTALL
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # 🔹 PREPARE DIRS
      # ==============================
      - name: Prepare directories
        run: |
          mkdir -p data/raw outputs models logs

      # ==============================
      # 🔹 DOWNLOAD DATA
      # ==============================
      - name: Download dataset
        run: |
          echo "📥 Downloading dataset..."

          curl -L -o data/raw/Online_Retail.xlsx \
          "[https://github.com/VenuOnTech/Customer-Segmentation-AI-System/releases/download/v1.0.0-data/Online_Retail.xlsx](https://github.com/VenuOnTech/Customer-Segmentation-AI-System/releases/download/v1.0.0-data/Online_Retail.xlsx)"

          if [ ! -f data/raw/Online_Retail.xlsx ]; then
            echo "❌ Dataset download failed"
            exit 1
          fi

          echo "✅ Dataset ready"
          ls -lh data/raw/

      # ==============================
      # 🔹 TESTS
      # ==============================
      - name: Run tests
        run: python tests/test_pipeline.py

      # ==============================
      # 🔹 RUN PIPELINE
      # ==============================
      - name: Run ML pipeline
        run: python main.py

      # ==============================
      # 🔹 VERIFY OUTPUT
      # ==============================
      - name: Verify outputs
        run: |
          echo "🔍 Checking outputs..."
          if [ ! -f outputs/transformer_segments.csv ]; then
            echo "❌ transformer_segments.csv missing!"
            exit 1
          fi
          echo "✅ All outputs generated"
          ls -R outputs/

      # ==============================
      # 🔥 CREATE FRESH RELEASE
      # ==============================
      - name: Create fresh GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest ML Pipeline Output"
          files: |
            outputs/transformer_segments.csv
          body: |
            ✅ Auto-generated ML results
      
            - Dataset: Online Retail
            - Architecture: Self-Supervised Trajectory Transformer
            - Run: ${{ github.run_number }}

      # ==============================
      # 🔹 UPLOAD ARTIFACTS (OPTIONAL)
      # ==============================
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: customer-segmentation-results
          path: outputs/
          retention-days: 30

      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: models/
          retention-days: 30

      # ==============================
      # 🔹 SUCCESS LOG
      # ==============================
      - name: Pipeline Summary
        if: success()
        run: |
          echo "=================================="
          echo "✅ PIPELINE SUCCESS"
          echo "=================================="
          echo "📊 Data processed"
          echo "🤖 Models trained"
          echo "📈 Results generated"
          echo "🚀 Release UPDATED (latest)"
          echo "=================================="